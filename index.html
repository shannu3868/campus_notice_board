<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Notice Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            🎓 Campus Notice Board
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#notices">Notices</a>
            <a href="#add-notice">Add Notice</a>
        </nav>
    </header>

    <!-- Main Section -->
    <section class="hero" id="home">

        <h1>Welcome to Campus Notice Board</h1>

        <p>
            Stay updated with the latest college announcements,
            events and important information.
        </p>

    </section>

    <!-- Notice Section -->
    <section class="container" id="notices">

        <h2>Latest Notices</h2>

        <!-- Department Filter -->
        <div class="filter">

            <label for="departmentFilter">
                Filter by Department:
            </label>

            <select id="departmentFilter">

                <option value="All">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                <option value="General">General</option>

            </select>

        </div>

        <!-- Notices Display -->
        <div id="noticeList" class="notice-grid"></div>

    </section>

    <!-- Add Notice Section -->
    <section class="container add-section" id="add-notice">

        <h2>Post a New Notice</h2>

        <form id="noticeForm">

            <label>Notice Title</label>

            <input
                type="text"
                id="title"
                placeholder="Enter notice title"
                required
            >

            <label>Department</label>

            <select id="department" required>

                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                <option value="General">General</option>

            </select>

            <label>Date</label>

            <input
                type="date"
                id="date"
                required
            >

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Enter complete notice description"
                required
            ></textarea>

            <button type="submit">
                Publish Notice
            </button>

        </form>

    </section>
<!-- Notice Details Modal -->

<div id="noticeModal" class="modal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2 id="detailTitle"></h2>

        <p id="detailDepartment"></p>

        <p id="detailDate"></p>

        <hr>

        <p id="detailDescription"></p>

        <button id="closeButton">Close</button>

    </div>

</div>
    <!-- Footer -->
    <footer>

        <p>© 2026 Campus Notice Board | All Rights Reserved</p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
